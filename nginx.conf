server {
    # The port Nginx will listen on (HTTP default)
    listen 80;

    # Server name (can be localhost or your domain)
    server_name localhost;

    # Root folder: where Nginx will look for files to serve
    # On Windows, use forward slashes (/) instead of backslashes (\)
    root /usr/share/nginx/html;

    # Default file to serve when a folder URL is requested
    index index.html;

    # Location block: defines how Nginx handles requests to '/'
    location / {
        # try_files checks if requested URL exists as a file or folder
        # If not, serve index.html (important for SPA routing)
        try_files $uri $uri/ /index.html =404;
    }
    #files are different here as nginx.conf interacts with local filesystem 
    #in docker using alpine , nginx runs in a linux container 
}